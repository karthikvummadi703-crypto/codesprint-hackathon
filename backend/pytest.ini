[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# The `live` marker makes real network calls and is documented as opt-in, so it
# has to actually be opt-in. `pytest -m live` re-enables it explicitly.
addopts = -m "not live"
filterwarnings =
    ignore::DeprecationWarning
markers =
    live: makes real network calls to live providers
